name: checks

# Why this exists: the failure mode of a change to the DSP chain is silent.
# Nothing raises, the window still opens, a picture still appears -- it is just
# subtly wrong, or 4 dB worse, or the band scan finds a carrier that is not
# there. Every one of those was caught here by running the suite, not by
# reading the diff.
#
# What is and is not a gate, stated plainly, because a CI badge that means
# less than it appears to is worse than no badge at all:
#
#   Thresholds asserted (a wrong number fails the build):
#     check_scan     band search, merging, off-chart, empty band
#     check_alerts   dedupe, cooldown, lost-signal, same-transmitter identity
#     check_ui       the real Qt window, offscreen, with screenshots
#     check_layout   nothing clipped, nothing squeezed
#     check_worker   the streaming decode sustains a real frame rate
#     diag_edges     sync detection genuinely locks onto SYNC pulses
#     bench_coarse   the coarse gate's false-positive rate
#
#   Smoke only (a crash fails the build; a judgement call does not):
#     check_sources          sim/noise/real-capture end to end
#     check_frame_structure  describes frames other checks wrote
#
#   Reported, not gating:
#     bench_sim   real-time pacing. A shared runner measures a wall-clock
#                 deadline, so any co-tenant stealing CPU fails the build for a
#                 change that did not cause it. A measurement, not a check.
#
#   Hardware only, deliberately absent -- there is no radio in CI:
#     check_hardware_scan   a real sweep of a real, empty band
#     diag_spurs            is that carrier the band, or the radio's own LO?
#     diag_peak_bin         names the exact bin a "carrier" sits in
#   check_hardware_scan is the one that caught the HackRF's DC leakage, which
#   no amount of simulator testing could have. It asserts the *absence* of a
#   finding, so it is only meaningful against a real and genuinely quiet band.
#   Run all three by hand when the radio is plugged in.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight. Without this, four pushes in quick
  # succession queue four full runs and the last one -- the only one anyone is
  # waiting for -- finishes last.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Both platforms, because the bugs worth catching here are not confined to
    # the DSP: a missing directory, a hardcoded path and an undeclared
    # dependency are all platform-agnostic failures that a single-OS run would
    # have missed on the other one. Windows is the shipping target and the
    # platform with the Windows-only timer, subprocess and winsound paths.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Developed and verified on 3.14; 3.12 is the oldest with wheels for
          # numpy, scipy and PySide6 alike, so this also checks the code is not
          # quietly relying on a recent interpreter.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: five checks save a PNG via
        # Pillow, and the app itself does not use it. The three-dep split keeps
        # that out of the packaged .exe while still making the checks
        # reproducible from a clean checkout.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: PySide6 runtime libraries
        # The GUI checks run offscreen, which removes the need for an X server
        # but not for the GL and D-Bus libraries Qt still links against.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0

      - name: Threshold checks
        run: |
          set -o pipefail
          status=0
          for check in \
            check_scan check_alerts check_ui check_layout check_worker \
            diag_edges bench_coarse
          do
            echo ""
            echo "::group::$check"
            python "tools/$check.py" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Smoke checks
        # These report rather than assert; they exist to catch a crash in the
        # end-to-end path. A non-zero exit still fails the step.
        run: |
          set -o pipefail
          status=0
          for check in check_sources check_frame_structure; do
            echo ""
            echo "::group::$check"
            python "tools/$check.py" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Real-time pacing (informational)
        # Not part of the gate, and deliberately so. See the header.
        continue-on-error: true
        run: python tools/bench_sim.py

      - name: Upload screenshots
        # check_ui.py and check_layout.py write PNGs on the way through. On a
        # failure they are the fastest way to see what the window actually did,
        # so they are worth keeping either way.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.os }}
          path: _validate_out/
          if-no-files-found: ignore
          retention-days: 14
